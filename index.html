<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheese Uncopylocked Leaker Form</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --grid-color: rgba(255, 200, 0, 0.07);
            --cheese-yellow: #ffcc00;
            --cheese-hover: #e6b800;
            --text-color: #ffffff;
            --input-bg: #181818;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #121212;
            border: 2px solid var(--cheese-yellow);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: var(--cheese-yellow);
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--cheese-yellow);
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.3);
        }

        input[type="file"] {
            cursor: pointer;
            padding: 8px;
        }

        input[type="file"]::file-selector-button {
            background: var(--cheese-yellow);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--cheese-hover);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            background: var(--cheese-yellow);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        button:hover {
            background: var(--cheese-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .notification {
            margin-top: 15px;
            padding: 12px;
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .file-hint {
            font-size: 0.8rem;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧀 Cheese Uncopylocked Form</h1>
    
    <form id="leakerForm">
        <div class="grid-2">
            <div class="form-group">
                <label for="emoji">Emoji</label>
                <input type="text" id="emoji" placeholder="Emoji" required>
            </div>
            
            <div class="form-group">
                <label for="tag">Subtitle</label>
                <select id="tag">
                    <option value="BEST">BEST</option>
                    <option value="NEW">NEW</option>
                    <option value="SAB">SAB</option>
                    <option value="CASHGRAB">CASHGRAB</option>
                    <option value="PAID">PAID</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Title" required>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Author" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="backdoored">Backdoored?</label>
                <select id="backdoored">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="Likely">Likely</option>
                    <option value="Unlikely">Unlikely</option>
                    <option value="Unsure">Unsure</option>
                </select>
            </div>

            <div class="form-group">
                <label for="template">Template?</label>
                <select id="template">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="Unsure">Unsure</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="leaked">Leaked?</label>
                <select id="leaked">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="Unsure">Unsure</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="text" id="date" placeholder="Date" value="Newest">
            </div>
        </div>

        <div class="form-group">
            <label for="fileInput">Upload File (LUA, RBXM, RBXL, LUAU)</label>
            <input type="file" id="fileInput" accept=".lua,.rbxm,.rbxl,.luau">
            <div class="file-hint">Note: LUA/LUAU files will have comments stripped automatically.</div>
        </div>

        <button type="submit">Generate & Copy Info</button>
    </form>

    <div class="notification" id="notification">
        Discord layout copied to clipboard! Renamed file downloading...
    </div>
</div>

<script>
    document.getElementById('leakerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // 1. Gather Form Data
        const emoji = document.getElementById('emoji').value;
        const tag = document.getElementById('tag').value;
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;
        const backdoored = document.getElementById('backdoored').value;
        const template = document.getElementById('template').value;
        const leaked = document.getElementById('leaked').value;
        const date = document.getElementById('date').value;
        const fileInput = document.getElementById('fileInput');

        // Image URL wrapped in angle brackets < > prevents Discord from showing an embed preview
        const imageUrl = "<https://cdn.discordapp.com/attachments/1496787258072764527/1505746814341742623/roblox_thumbnail.png?ex=6a0bbf7f&is=6a0a6dff&hm=d6d6c9a88dbfeb3a4d10a66695fc288ca4094b9d79adc0a62d8b57971d893dc8&>";

        // 2. Generate Discord Text Format
        const discordMarkdown = `# ${emoji} | [${tag}] ${title}.\n` +
                                `> -# - Author: ${author}\n` +
                                `> -# - Backdoored: ${backdoored}\n` +
                                `> -# - Template: ${template}\n` +
                                `> -# - Leaked: ${leaked}\n` +
                                `> -# - Date: ${date}\n` +
                                `${imageUrl}`;

        // 3. Copy To Keyboard/Clipboard
        try {
            await navigator.clipboard.writeText(discordMarkdown);
        } catch (err) {
            console.error('Failed to copy text: ', err);
        }

        // 4. File Processing & Renaming System
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const originalName = file.name;
            const extension = originalName.substring(originalName.lastIndexOf('.')).toLowerCase();
            
            // Format new output name: 🧀 I <Title>.<extension>
            const newFileName = `🧀 I ${title}${extension}`;

            if (extension === '.lua' || extension === '.luau') {
                // Read and clean code comments for plain text LUA scripts
                const reader = new FileReader();
                reader.onload = function(event) {
                    let fileContent = event.target.result;
                    
                    // Safe regex to strip single-line '--' comments and multi-line '--[[ ]]' blocks
                    let cleanContent = fileContent
                        .replace(/--\[\[[\s\S]*?\]\]/g, '') // Multi-line
                        .replace(/--.*$/gm, '');            // Single line
                    
                    triggerDownload(new Blob([cleanContent], { type: 'text/plain' }), newFileName);
                };
                reader.readAsText(file);
            } else {
                // For binary structures like .rbxm / .rbxl, pass through unaltered to protect integrity
                triggerDownload(file, newFileName);
            }
        }

        // Show Visual Toast Success Info
        const notification = document.getElementById('notification');
        notification.style.display = 'block';
        setTimeout(() => {
            notification.style.display = 'none';
        }, 4000);
    });

    function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
